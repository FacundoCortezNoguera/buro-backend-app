spring.application.name=buro-backend-app
server.port=8080

#--------------BBDD---------------
spring.datasource.url=jdbc:postgresql://localhost:5432/mi_base
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

#--------------JPA---------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#--------------FLYWAY---------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

#--------------JWT---------------
jwt.secret=BuroSecretKey2024MustBeAtLeast32CharactersLong
jwt.expiration-ms=28800000

#--------------CORS---------------
cors.allowed-origins=http://localhost:4200,http://localhost:3000

#--------------EMAIL---------------
app.email.enabled=true

# Gmail SMTP - Reemplazar con email y App Password reales
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#--------------FRONTEND URL (para links en emails)---------------
app.frontend.url=http://localhost:4200

#--------------CAMARA ANVIZ---------------
app.camara.api-key=BURO-CAMARA-2024-SECRET-KEY
app.camara.hora-esperada=22:00