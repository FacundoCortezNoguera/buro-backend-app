services:
  postgres:
    image: postgres:16-alpine
    container_name: buro-postgres
    environment:
      POSTGRES_DB: mi_base
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - buro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d mi_base"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: buro-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mi_base
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      JWT_SECRET: BuroSecretKey2024MustBeAtLeast32CharactersLong
      # Email - Reemplazar con tu Gmail y App Password
      MAIL_USERNAME: ${MAIL_USERNAME:-tu-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-tu-app-password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  buro_postgres_data:
